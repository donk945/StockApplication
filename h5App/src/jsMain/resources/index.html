<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>股票问答</title>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<style>
    *{
      margin: 0;
      padding: 0;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
        overflow: hidden
    }
    input:focus {
      outline: none;
    }
    .toast-wrapper {
        position: fixed;
        z-index: 100000;
        height: 30px;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        top: 70px;
        pointer-events: none;
    }
    .toast-content {
        display: flex;
        font-size: 13px;
        line-height: 30px;
        min-width: 150px;
        padding: 0 12px;
        color: #fff;
        background: rgba(0, 0, 0, 0.78);
        border-radius: 8px;
        justify-content: center;
    }
    .list-no-scrollbar {
        scrollbar-width: none;
    }
    .list-no-scrollbar::-webkit-scrollbar {
        display: none;
    }
</style>
<body>
<div id="root"></div>
<script type="text/javascript" src="http://127.0.0.1:8083/nativevue2.js"></script>
<script type="text/javascript" src="h5App.js"></script>
</body>
</html>
